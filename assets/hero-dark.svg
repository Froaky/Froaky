<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="t d">
  <title id="t">Mateo Coca, systems analyst and developer</title>
  <desc id="d">Spreadsheets, time clocks and cash drawers, turned into systems you can audit. A sample cash log shows four movements posted and an edit on a closed day rejected.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .row { transform-box: fill-box; }
    @keyframes r0 { 0%, 6% { opacity: 0; transform: translateY(6px); } 9%, 93% { opacity: 1; transform: none; } 98%, 100% { opacity: 0; transform: none; } }
    .r0 { animation: r0 14s ease-out infinite; }
    @keyframes r1 { 0%, 18% { opacity: 0; transform: translateY(6px); } 21%, 93% { opacity: 1; transform: none; } 98%, 100% { opacity: 0; transform: none; } }
    .r1 { animation: r1 14s ease-out infinite; }
    @keyframes r2 { 0%, 30% { opacity: 0; transform: translateY(6px); } 33%, 93% { opacity: 1; transform: none; } 98%, 100% { opacity: 0; transform: none; } }
    .r2 { animation: r2 14s ease-out infinite; }
    @keyframes r3 { 0%, 42% { opacity: 0; transform: translateY(6px); } 45%, 93% { opacity: 1; transform: none; } 98%, 100% { opacity: 0; transform: none; } }
    .r3 { animation: r3 14s ease-out infinite; }
    @keyframes r4 { 0%, 56% { opacity: 0; transform: translateY(6px); } 59%, 93% { opacity: 1; transform: none; } 98%, 100% { opacity: 0; transform: none; } }
    .r4 { animation: r4 14s ease-out infinite; }
    @keyframes travel { 0% { transform: translateX(0); opacity: 0; } 15%, 85% { opacity: 1; } 100% { transform: translateX(48px); opacity: 0; } }
    .dot { animation: travel 1.8s linear infinite; }
    .d1 { animation-delay: 0.9s; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    .live { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes flash { 0%, 56% { opacity: 0; } 59% { opacity: 0.32; } 66%, 93% { opacity: 0.12; } 98%, 100% { opacity: 0; } }
    .flash { animation: flash 14s ease-out infinite; }
    @media (prefers-reduced-motion: reduce) { .row, .dot, .live, .flash { animation: none; } }
  </style>
  <rect x="0.5" y="0.5" width="899" height="599" rx="16" fill="#111316" stroke="#2B3038"/>

  <text x="48" y="60" class="mono" font-size="12.5" letter-spacing="1.6" fill="#F2A93B">MATEO COCA  /  SYSTEMS ANALYST AND DEVELOPER</text>
  <circle class="live" cx="632" cy="56" r="4" fill="#7FD1A0"/>
  <text x="852" y="60" text-anchor="end" class="mono" font-size="12.5" fill="#B9BEC6">Available · remote, from Salta</text>

  <text x="48" y="118" font-size="33" font-weight="700" letter-spacing="-0.4" fill="#ECE9E1">Spreadsheets, time clocks and cash drawers,</text>
  <text x="48" y="160" font-size="33" font-weight="700" letter-spacing="-0.4" fill="#ECE9E1">turned into <tspan fill="#F2A93B">systems you can audit.</tspan></text>
  <text x="48" y="198" font-size="15.5" fill="#B9BEC6">APIs and internal tools that run day-to-day operations: treasury, attendance, compliance.</text>

  <rect x="48.5" y="230.5" width="803" height="262" rx="12" fill="#181B20" stroke="#2B3038"/>
  <text x="72" y="256" class="mono" font-size="12" fill="#ECE9E1">Cash</text><rect x="72" y="267" width="29.2" height="2" fill="#F2A93B"/><text x="127.2" y="256" class="mono" font-size="12" fill="#858C97">Time clocks</text><text x="233.5" y="256" class="mono" font-size="12" fill="#858C97">Site gate</text><text x="325.2" y="256" class="mono" font-size="12" fill="#858C97">AI</text>
  <text x="828" y="256" text-anchor="end" class="mono" font-size="11.5" fill="#858C97">simulation with sample data</text>
  <line x1="49" y1="269.5" x2="851" y2="269.5" stroke="#2B3038"/>
  
    <rect x="72" y="288" width="220" height="50" rx="8" fill="#111316" stroke="#2B3038"/>
    <text x="88" y="309" font-size="13.5" font-weight="600" fill="#ECE9E1">Branch cash drawer</text>
    <text x="88" y="327" class="mono" font-size="11" fill="#858C97">shifts and movements</text>
    <rect x="340" y="288" width="220" height="50" rx="8" fill="#111316" stroke="#2B3038"/>
    <text x="356" y="309" font-size="13.5" font-weight="600" fill="#ECE9E1">Business rules</text>
    <text x="356" y="327" class="mono" font-size="11" fill="#858C97">Django + PostgreSQL</text>
    <rect x="608" y="288" width="220" height="50" rx="8" fill="#111316" stroke="#2B3038"/>
    <text x="624" y="309" font-size="13.5" font-weight="600" fill="#ECE9E1">Central treasury</text>
    <text x="624" y="327" class="mono" font-size="11" fill="#858C97">daily closing, audit</text>
  
    <line x1="292" y1="313" x2="340" y2="313" stroke="#2B3038" stroke-width="1.5"/>
    <circle class="dot d0" cx="292" cy="313" r="3.5" fill="#F2A93B"/>
    <line x1="560" y1="313" x2="608" y2="313" stroke="#2B3038" stroke-width="1.5"/>
    <circle class="dot d1" cx="560" cy="313" r="3.5" fill="#F2A93B"/>
  
    <g class="row r0">
      
      <text x="72" y="376" class="mono" font-size="13" fill="#858C97">09:12</text>
      <text x="134" y="376" class="mono" font-size="13" fill="#ECE9E1">Cash in, morning shift</text>
      <circle cx="424" cy="371.5" r="3.5" fill="#7FD1A0"/>
      <text x="438" y="376" class="mono" font-size="13" fill="#7FD1A0">validated and posted</text>
    </g>
    <g class="row r1">
      
      <text x="72" y="400" class="mono" font-size="13" fill="#858C97">11:40</text>
      <text x="134" y="400" class="mono" font-size="13" fill="#ECE9E1">Supplier payment</text>
      <circle cx="424" cy="395.5" r="3.5" fill="#7FD1A0"/>
      <text x="438" y="400" class="mono" font-size="13" fill="#7FD1A0">validated and posted</text>
    </g>
    <g class="row r2">
      
      <text x="72" y="424" class="mono" font-size="13" fill="#858C97">14:05</text>
      <text x="134" y="424" class="mono" font-size="13" fill="#ECE9E1">Transfer to treasury</text>
      <circle cx="424" cy="419.5" r="3.5" fill="#7FD1A0"/>
      <text x="438" y="424" class="mono" font-size="13" fill="#7FD1A0">posted</text>
    </g>
    <g class="row r3">
      
      <text x="72" y="448" class="mono" font-size="13" fill="#858C97">20:30</text>
      <text x="134" y="448" class="mono" font-size="13" fill="#ECE9E1">Daily closing</text>
      <circle cx="424" cy="443.5" r="3.5" fill="#7FD1A0"/>
      <text x="438" y="448" class="mono" font-size="13" fill="#7FD1A0">ledger locked</text>
    </g>
    <g class="row r4">
      <rect class="flash" x="60" y="456" width="780" height="23" rx="4" fill="#F2786A" opacity="0.12"/>
      <text x="72" y="472" class="mono" font-size="13" fill="#858C97">20:42</text>
      <text x="134" y="472" class="mono" font-size="13" fill="#ECE9E1">Edit on the closed day</text>
      <circle cx="424" cy="467.5" r="3.5" fill="#F2786A"/>
      <text x="438" y="472" class="mono" font-size="13" fill="#F2786A">rejected: ledger locked</text>
    </g>
  
    
    <text x="48" y="541" font-size="22" font-weight="700" fill="#ECE9E1">4h → 5min</text>
    <text x="48" y="562" font-size="12" fill="#858C97">daily manual sync, automated</text>
    <line x1="249" y1="522" x2="249" y2="566" stroke="#2B3038"/>
    <text x="269" y="541" font-size="22" font-weight="700" fill="#ECE9E1">100%</text>
    <text x="269" y="562" font-size="12" fill="#858C97">of the spreadsheets replaced</text>
    <line x1="450" y1="522" x2="450" y2="566" stroke="#2B3038"/>
    <text x="470" y="541" font-size="22" font-weight="700" fill="#ECE9E1">5</text>
    <text x="470" y="562" font-size="12" fill="#858C97">systems in production</text>
    <line x1="651" y1="522" x2="651" y2="566" stroke="#2B3038"/>
    <text x="671" y="541" font-size="22" font-weight="700" fill="#ECE9E1">~1,400</text>
    <text x="671" y="562" font-size="12" fill="#858C97">automated tests on one system</text>
</svg>
