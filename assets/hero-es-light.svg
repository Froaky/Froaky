<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="t d">
  <title id="t">Mateo Coca, analista de sistemas y desarrollador</title>
  <desc id="d">Planillas, relojes y cajas, convertidos en sistemas que se pueden auditar. Un registro de caja de ejemplo muestra cuatro movimientos asentados y un cambio rechazado sobre un día cerrado.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .row { transform-box: fill-box; }
    @keyframes r0 { 0%, 6% { opacity: 0; transform: translateY(6px); } 9%, 93% { opacity: 1; transform: none; } 98%, 100% { opacity: 0; transform: none; } }
    .r0 { animation: r0 14s ease-out infinite; }
    @keyframes r1 { 0%, 18% { opacity: 0; transform: translateY(6px); } 21%, 93% { opacity: 1; transform: none; } 98%, 100% { opacity: 0; transform: none; } }
    .r1 { animation: r1 14s ease-out infinite; }
    @keyframes r2 { 0%, 30% { opacity: 0; transform: translateY(6px); } 33%, 93% { opacity: 1; transform: none; } 98%, 100% { opacity: 0; transform: none; } }
    .r2 { animation: r2 14s ease-out infinite; }
    @keyframes r3 { 0%, 42% { opacity: 0; transform: translateY(6px); } 45%, 93% { opacity: 1; transform: none; } 98%, 100% { opacity: 0; transform: none; } }
    .r3 { animation: r3 14s ease-out infinite; }
    @keyframes r4 { 0%, 56% { opacity: 0; transform: translateY(6px); } 59%, 93% { opacity: 1; transform: none; } 98%, 100% { opacity: 0; transform: none; } }
    .r4 { animation: r4 14s ease-out infinite; }
    @keyframes travel { 0% { transform: translateX(0); opacity: 0; } 15%, 85% { opacity: 1; } 100% { transform: translateX(48px); opacity: 0; } }
    .dot { animation: travel 1.8s linear infinite; }
    .d1 { animation-delay: 0.9s; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    .live { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes flash { 0%, 56% { opacity: 0; } 59% { opacity: 0.32; } 66%, 93% { opacity: 0.12; } 98%, 100% { opacity: 0; } }
    .flash { animation: flash 14s ease-out infinite; }
    @media (prefers-reduced-motion: reduce) { .row, .dot, .live, .flash { animation: none; } }
  </style>
  <rect x="0.5" y="0.5" width="899" height="599" rx="16" fill="#F5F2E9" stroke="#D8D2C1"/>

  <text x="48" y="60" class="mono" font-size="12.5" letter-spacing="1.6" fill="#A8590A">MATEO COCA  /  ANALISTA DE SISTEMAS Y DESARROLLADOR</text>
  <circle class="live" cx="618.0" cy="56" r="4" fill="#1F7A4C"/>
  <text x="852" y="60" text-anchor="end" class="mono" font-size="12.5" fill="#3D424A">Disponible · remoto, desde Salta</text>

  <text x="48" y="118" font-size="33" font-weight="700" letter-spacing="-0.4" fill="#1A1C20">Planillas, relojes y cajas, convertidos en</text>
  <text x="48" y="160" font-size="33" font-weight="700" letter-spacing="-0.4" fill="#1A1C20"><tspan fill="#A8590A">sistemas que se pueden auditar.</tspan></text>
  <text x="48" y="198" font-size="15.5" fill="#3D424A">APIs y herramientas internas que sostienen la operación diaria: tesorería, asistencia, habilitaciones.</text>

  <rect x="48.5" y="230.5" width="803" height="262" rx="12" fill="#FCFBF7" stroke="#D8D2C1"/>
  <text x="72" y="256" class="mono" font-size="12" fill="#1A1C20">Cajas</text><rect x="72" y="267" width="36.5" height="2" fill="#A8590A"/><text x="134.5" y="256" class="mono" font-size="12" fill="#666C75">Relojes</text><text x="211.6" y="256" class="mono" font-size="12" fill="#666C75">Portería</text><text x="296" y="256" class="mono" font-size="12" fill="#666C75">IA</text>
  <text x="828" y="256" text-anchor="end" class="mono" font-size="11.5" fill="#666C75">simulación con datos de ejemplo</text>
  <line x1="49" y1="269.5" x2="851" y2="269.5" stroke="#D8D2C1"/>
  
    <rect x="72" y="288" width="220" height="50" rx="8" fill="#F5F2E9" stroke="#D8D2C1"/>
    <text x="88" y="309" font-size="13.5" font-weight="600" fill="#1A1C20">Caja de sucursal</text>
    <text x="88" y="327" class="mono" font-size="11" fill="#666C75">turnos y movimientos</text>
    <rect x="340" y="288" width="220" height="50" rx="8" fill="#F5F2E9" stroke="#D8D2C1"/>
    <text x="356" y="309" font-size="13.5" font-weight="600" fill="#1A1C20">Reglas de negocio</text>
    <text x="356" y="327" class="mono" font-size="11" fill="#666C75">Django + PostgreSQL</text>
    <rect x="608" y="288" width="220" height="50" rx="8" fill="#F5F2E9" stroke="#D8D2C1"/>
    <text x="624" y="309" font-size="13.5" font-weight="600" fill="#1A1C20">Tesorería central</text>
    <text x="624" y="327" class="mono" font-size="11" fill="#666C75">cierre diario, auditoría</text>
  
    <line x1="292" y1="313" x2="340" y2="313" stroke="#D8D2C1" stroke-width="1.5"/>
    <circle class="dot d0" cx="292" cy="313" r="3.5" fill="#A8590A"/>
    <line x1="560" y1="313" x2="608" y2="313" stroke="#D8D2C1" stroke-width="1.5"/>
    <circle class="dot d1" cx="560" cy="313" r="3.5" fill="#A8590A"/>
  
    <g class="row r0">
      
      <text x="72" y="376" class="mono" font-size="13" fill="#666C75">09:12</text>
      <text x="134" y="376" class="mono" font-size="13" fill="#1A1C20">Ingreso, turno mañana</text>
      <circle cx="424" cy="371.5" r="3.5" fill="#1F7A4C"/>
      <text x="438" y="376" class="mono" font-size="13" fill="#1F7A4C">validado y asentado</text>
    </g>
    <g class="row r1">
      
      <text x="72" y="400" class="mono" font-size="13" fill="#666C75">11:40</text>
      <text x="134" y="400" class="mono" font-size="13" fill="#1A1C20">Pago a proveedor</text>
      <circle cx="424" cy="395.5" r="3.5" fill="#1F7A4C"/>
      <text x="438" y="400" class="mono" font-size="13" fill="#1F7A4C">validado y asentado</text>
    </g>
    <g class="row r2">
      
      <text x="72" y="424" class="mono" font-size="13" fill="#666C75">14:05</text>
      <text x="134" y="424" class="mono" font-size="13" fill="#1A1C20">Traspaso a tesorería</text>
      <circle cx="424" cy="419.5" r="3.5" fill="#1F7A4C"/>
      <text x="438" y="424" class="mono" font-size="13" fill="#1F7A4C">asentado</text>
    </g>
    <g class="row r3">
      
      <text x="72" y="448" class="mono" font-size="13" fill="#666C75">20:30</text>
      <text x="134" y="448" class="mono" font-size="13" fill="#1A1C20">Cierre del día</text>
      <circle cx="424" cy="443.5" r="3.5" fill="#1F7A4C"/>
      <text x="438" y="448" class="mono" font-size="13" fill="#1F7A4C">libro bloqueado</text>
    </g>
    <g class="row r4">
      <rect class="flash" x="60" y="456" width="780" height="23" rx="4" fill="#B5301F" opacity="0.12"/>
      <text x="72" y="472" class="mono" font-size="13" fill="#666C75">20:42</text>
      <text x="134" y="472" class="mono" font-size="13" fill="#1A1C20">Cambio en el día cerrado</text>
      <circle cx="424" cy="467.5" r="3.5" fill="#B5301F"/>
      <text x="438" y="472" class="mono" font-size="13" fill="#B5301F">rechazado: libro bloqueado</text>
    </g>
  
    
    <text x="48" y="541" font-size="22" font-weight="700" fill="#1A1C20">4h → 5min</text>
    <text x="48" y="562" font-size="12" fill="#666C75">sincronización manual diaria</text>
    <line x1="249" y1="522" x2="249" y2="566" stroke="#D8D2C1"/>
    <text x="269" y="541" font-size="22" font-weight="700" fill="#1A1C20">100%</text>
    <text x="269" y="562" font-size="12" fill="#666C75">de las planillas reemplazadas</text>
    <line x1="450" y1="522" x2="450" y2="566" stroke="#D8D2C1"/>
    <text x="470" y="541" font-size="22" font-weight="700" fill="#1A1C20">5</text>
    <text x="470" y="562" font-size="12" fill="#666C75">sistemas en producción</text>
    <line x1="651" y1="522" x2="651" y2="566" stroke="#D8D2C1"/>
    <text x="671" y="541" font-size="22" font-weight="700" fill="#1A1C20">~1.400</text>
    <text x="671" y="562" font-size="12" fill="#666C75">tests automáticos en un sistema</text>
</svg>
